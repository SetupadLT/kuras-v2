name: Fuel data and static site

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Atsisiųsti naujausius LEA duomenis'
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - 'static/**'
      - 'bin/build-static.php'
      - 'bin/build-market-data.php'
      - 'bin/build-coordinate-cache.mjs'
      - 'resources/station-coordinates.json'
      - 'src/Service/StaticDataExporter.php'
      - 'src/Service/Import/**'
      - 'src/Service/MarketData/**'
      - '.github/workflows/static-site.yml'
  schedule:
    # Two off-peak checks per hour give the GitHub best-effort scheduler a
    # second chance when one scheduled event is delayed or dropped.
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'static/**'
      - '!static/data/**'
      - 'bin/build-static.php'
      - 'bin/build-market-data.php'
      - 'bin/build-coordinate-cache.mjs'
      - 'resources/station-coordinates.json'
      - 'src/Service/StaticDataExporter.php'
      - 'src/Service/Import/**'
      - 'src/Service/MarketData/**'
      - '.github/workflows/static-site.yml'

permissions:
  contents: read

concurrency:
  group: public-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        with:
          php-version: '8.2'
          extensions: curl, mbstring, zip
          coverage: none
      - if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: composer install --no-interaction --prefer-dist --no-dev
      - name: Download, validate and publish latest LEA data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: php bin/build-static.php --output=dist --previous-data=static/data/current.json --previous-history=static/data/history.json --archive-output=var/import-artifact
      - name: Update official ORLEN and Brent market context
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: php bin/build-market-data.php --output=dist/data/market.json --previous=static/data/market.json
      - name: Prepare site with the last validated fuel snapshot
        if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_data)
        run: |
          test -s static/data/current.json
          test -s static/data/current.js
          mkdir -p dist
          cp -R static/. dist/
      - name: Record successful LEA source check
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          mkdir -p dist/data
          php -r '$status = ["checked_at" => (new DateTimeImmutable("now", new DateTimeZone("UTC")))->format(DateTimeInterface::ATOM)]; file_put_contents("dist/data/status.json", json_encode($status, JSON_UNESCAPED_SLASHES) . PHP_EOL);'
      - name: Package the public site
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: dist
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        with:
          name: validated-snapshot
          path: |
            dist/data/current.json
            dist/data/current.js
            dist/data/history.json
            dist/data/market.json
            dist/data/status.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        with:
          name: lea-import-${{ github.run_id }}
          path: var/import-artifact
          if-no-files-found: warn
          retention-days: 90

  save-snapshot:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-snapshot
          path: var/snapshot
      - name: Save the latest validated snapshot in GitHub
        continue-on-error: true
        run: |
          cp var/snapshot/current.json static/data/current.json
          cp var/snapshot/current.js static/data/current.js
          cp var/snapshot/history.json static/data/history.json
          cp var/snapshot/market.json static/data/market.json
          cp var/snapshot/status.json static/data/status.json
          git config user.name "kuras-data-bot"
          git config user.email "kuras-data-bot@users.noreply.github.com"
          git add static/data/current.json static/data/current.js static/data/history.json static/data/market.json static/data/status.json
          git diff --cached --quiet || git commit -m "Update fuel and market data [skip ci]"
          git push

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated public site
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: dist
      - name: Check out the public Pages repository
        uses: actions/checkout@v4
        with:
          repository: SetupadLT/kuras-v2-site
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: published
          fetch-depth: 0
      - name: Publish only browser-facing files
        run: |
          rsync -a --delete --exclude='.git/' dist/ published/
          touch published/.nojekyll
          printf '%s\n' 'kuraspricer.stpd.io' > published/CNAME
          git -C published config user.name 'kuras-data-bot'
          git -C published config user.email 'kuras-data-bot@users.noreply.github.com'
          git -C published add -A
          git -C published diff --cached --quiet || git -C published commit -m "Publish validated site from ${GITHUB_SHA}"
          git -C published push
